name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jupyter-book sphinx sphinxcontrib-bibtex

      - name: Build Jupyter Book
        run: |
          jupyter-book build book

      - name: Prepare site folder
        run: |
          mkdir site
          if [ -d "book/_build/html" ]; then
            cp -r book/_build/html/* site/
          elif [ -d "_build/html" ]; then
            cp -r _build/html/* site/
          else
            echo "Could not find built HTML output."
            find . -maxdepth 4 -type d
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4