name: Deploy Jupyter Book to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jupyter-book sphinx sphinxcontrib-bibtex

      - name: Build Jupyter Book
        run: |
          cd book
          jupyter-book build .

      - name: Locate built HTML
        run: |
          echo "Searching for built index.html..."
          find . -path "*/_build/html/index.html" -print
          SITE_DIR=$(dirname "$(find . -path "*/_build/html/index.html" | head -n 1)")
          echo "SITE_DIR=$SITE_DIR" >> $GITHUB_ENV
          echo "Detected site directory: $SITE_DIR"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4